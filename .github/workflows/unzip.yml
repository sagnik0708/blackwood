name: Unzip upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o blackwood-valley-outbreak.zip
          rm -rf blackwood-valley-outbreak/.github
          cp -r blackwood-valley-outbreak/. .
          rm -rf blackwood-valley-outbreak blackwood-valley-outbreak.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Import project from zip"
          git push
